name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional repository variable. Leave unset for the synthetic demo.
      MONEYTRACK_API_URL: ${{ vars.MONEYTRACK_API_URL }}
    steps:
      - name: Check out the complete source project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35 build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test financial calculations and build APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :core:test :app:assembleDebug "-PapiUrl=${MONEYTRACK_API_URL}"

      - name: Prepare APK and checksum
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/MoneyTrack-debug.apk
          cd artifacts
          sha256sum MoneyTrack-debug.apk > SHA256SUMS.txt

      - name: Upload downloadable APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTrack-debug-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTrack-unit-test-report
          path: core/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Show download instructions
        env:
          APK_DOWNLOAD_URL: ${{ steps.apk.outputs.artifact-url }}
        shell: bash
        run: |
          {
            echo '## MoneyTrack APK ready'
            echo "[Download APK artifact](${APK_DOWNLOAD_URL})"
            echo ''
            echo 'Unzip the artifact, transfer MoneyTrack-debug.apk to your Android phone, and install it.'
            echo 'Minimum Android version: Android 9 (API 28).'
            echo 'Choose Explore synthetic demo. No live service credentials are required.'
            echo 'This is a debug APK, not a production-signed Play Store release.'
          } >> "$GITHUB_STEP_SUMMARY"
