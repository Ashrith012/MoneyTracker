name: Validate MoneyTrack
on: [pull_request, workflow_dispatch]
permissions:
 contents: read
jobs:
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.13'
   - run: gradle :core:test :app:assembleDebug :app:lintDebug
   - uses: actions/upload-artifact@v4
     with:
      name: moneytrack-debug
      path: app/build/outputs/apk/debug/*.apk
 server:
  runs-on: ubuntu-latest
  defaults:
   run:
    working-directory: server
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '22'
   - run: npm ci
   - run: npm test

 device-tests:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.13'
   - name: Enable runner KVM access
     run: sudo chmod 666 /dev/kvm
   - uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 35
      arch: x86_64
      profile: pixel_6
      script: gradle :app:connectedDebugAndroidTest
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: instrumented-test-report
      path: app/build/reports/androidTests
